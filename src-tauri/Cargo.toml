[package]
name = "soundswap-tauri"
version = "0.1.0"
edition = "2021"

# Tauri 2.x requires this build script dependency
[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# Direct dependencies for Tauri v2 (NOT workspace-based)
[dependencies]
# Core Tauri crate
tauri = { version = "2.0", features = ["all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true

# SHA-256 hash verification for update checking
sha1 = "0.10"
hex = "0.4"

# HTTP client for GitHub API calls
reqwest = { workspace = true, default-features = false, features = ["json"] }

# Date/time functionality
chrono.workspace = true

# Async runtime
tokio.workspace = true

# Windows API access
winapi = "0.96"

# Configuration management (user settings)
dirs = "6.0"

# Regex pattern matching
regex = "1.10"

# Tauri v2 features
[features]
dev = []
default = ["dev"]
production = ["tauri-production-profile"]

