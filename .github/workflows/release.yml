name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Validate updater signing secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret.'
          }

      - name: Synchronize application version with release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$tag' must use semantic version format, for example v1.0.1."
          }

          $version = $Matches.version

          # Read line-by-line to handle both LF and CRLF checkouts.
          $cargoLines = @(Get-Content "Cargo.toml")
          $inPackageSection = $false
          $packageVersionFound = $false

          for ($i = 0; $i -lt $cargoLines.Count; $i++) {
            $line = $cargoLines[$i]

            if ($line -match '^\s*\[package\]\s*$') {
              $inPackageSection = $true
              continue
            }

            if ($line -match '^\s*\[') {
              $inPackageSection = $false
            }

            if ($inPackageSection -and $line -match '^\s*version\s*=') {
              $cargoLines[$i] = "version = `"$version`""
              $packageVersionFound = $true
              break
            }
          }

          if (-not $packageVersionFound) {
            throw "Could not find the package version in the [package] section of Cargo.toml."
          }

          $cargoUpdated = ($cargoLines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            "Cargo.toml",
            $cargoUpdated,
            [System.Text.UTF8Encoding]::new($false)
          )

          $tauriConfig = Get-Content -Raw "tauri.conf.json"
          $configPattern = '"version"\s*:\s*"[^"]+"'
          if (-not [regex]::IsMatch($tauriConfig, $configPattern)) {
            throw "Could not find the application version in tauri.conf.json."
          }

          $configUpdated = [regex]::Replace(
            $tauriConfig,
            $configPattern,
            "`"version`": `"$version`"",
            1
          )
          [System.IO.File]::WriteAllText(
            "tauri.conf.json",
            $configUpdated,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Building SoundSwaper version $version from tag $tag."

      - name: Build signed Windows updater artifacts
        run: cargo tauri build

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $msi = Get-ChildItem "target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "Tauri did not produce an MSI installer."
          }

          $signaturePath = "$($msi.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Updater signature not found: $signaturePath"
          }

          $signature = (Get-Content -Raw $signaturePath).Trim()
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($msi.Name)"
          $manifest = @{
            version = $version
            notes = "SoundSwaper $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 6

          [System.IO.File]::WriteAllText(
            "latest.json",
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish GitHub release and updater manifest
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            latest.json
