[package]
name = "soundswap"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "src/core",
    "tauri-plugins/tray-plugin",
    "tauri-plugins/hotkey-plugin",
]

# Core dependencies for Tauri v2 + Rust backend
[dependencies]
# Tauri 2.x core
tauri = { version = "^2.0.0", features = ["all"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
sha1 = "0.10"
hex = "^0.4"
reqwest = { version = "^0.11", default-features = false, features = ["json"] }
chrono = { version = "^0.4", default-features = false }
tokio = { version = "^1.35", features = ["full"] }

# Windows audio device access
winapi = { version = "^0.96", features = [ "corewindows", "winuser", "windef", "winbase" ] }

# Configuration management
dirs = "^6.0"

# Input validation
regex = "^1.10"

# UI helpers (optional, for theme preview)
rand = "^0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
