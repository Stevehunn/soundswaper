[package]
name = "soundswap"
version = "0.1.0"
edition = "2021"
description = "Switch your Windows audio input/output devices with keyboard shortcuts"

[lib]
path = "src-tauri/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

