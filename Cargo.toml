[package]
name = "soundswap"
version = "0.1.0"
edition = "2021"
description = "Switch your Windows audio input/output devices with keyboard shortcuts"

[workspace]
members = [
    "src-core",
    "tauri-plugins/tray-plugin",
]

[dependencies]
# Tauri 2.x core
tauri = { version = "^2.0.0", features = ["all"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
sha1 = "0.10"
hex = { version = "^0.4" }
reqwest = { version = "^0.11", default-features = false, features = ["json"] }
chrono = { version = "^0.4", default-features = false }
tokio = { version = "^1.35", features = ["full"] }

# Windows audio device access
winapi = { version = "^0.96", features = ["corewindows", "winuser", "windef", "winbase"] }

# Configuration management
dirs = { version = "^6.0" }

# Input validation
regex = { version = "^1.10" }

