[package]
name = "soundswap"
version = "0.1.0"
edition = "2021"
description = "Switch your Windows audio input/output devices with keyboard shortcuts"
license = "MIT"
build = "build.rs"

[lib]
path = "src-tauri/src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "soundswap"
path = "src-tauri/src/main.rs"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dirs = "6"
regex = "1"

[build-dependencies]
tauri-build = { version = "2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
